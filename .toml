[project]
name = "international-education-costs"
version = "1.0.0"
description = "International Education Costs Analysis and Machine Learning Pipeline"
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Maria Carvajal" }
]

dependencies = [
    "pandas>=2.2.0,<3.0.0",
    "numpy>=2.0.0,<3.0.0",
    "matplotlib>=3.9.0,<4.0.0",
    "seaborn>=0.13.2,<1.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "joblib>=1.4.2,<2.0.0",
    "openpyxl>=3.1.5,<4.0.0",
    "ydata-profiling>=4.12.0",
    "pytest>=8.3.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I"
]